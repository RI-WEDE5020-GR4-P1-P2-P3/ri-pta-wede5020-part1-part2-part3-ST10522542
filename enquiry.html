<section class="form-section">
    <h2>Product and Service Enquiries</h2>
    <p>Ask us about products, prices or availability.</p>

    <form id="enquiryForm">
        <label for="enquiryName">Full Name:</label>
        <input type="text" id="enquiryName" name="name"
               required minlength="2">

        <label for="enquiryEmail">Email Address:</label>
        <input type="email" id="enquiryEmail" name="email"
               required>

        <label for="enquiryType">Enquiry Type:</label>
        <select id="enquiryType" name="enquiryType" required>
            <option value="">Choose an option</option>
            <option value="Product">Product information</option>
            <option value="Price">Product prices</option>
            <option value="Availability">Product availability</option>
            <option value="Services">Other services</option>
        </select>

        <label for="enquiryMessage">Your Enquiry:</label>
        <textarea id="enquiryMessage" name="message"
                  rows="5" required minlength="10"></textarea>

        <button type="submit">Submit Enquiry</button>

        <p id="enquiryResponse" role="status"></p>
    </form>
</section>

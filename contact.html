<header>
    <h1>SaveMore Supermarket</h1>
    <p>Quality Products. Great Prices. Every Day.</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="specials.html">Specials</a>
    <a href="about.html">About Us</a>

    <a href="contact.html">Contact</a>

<section class="form-section">
    <h2>Contact SaveMore</h2>
    <p>Send us a general message.</p>

    <form id="contactForm">
        <label for="contactName">Full Name:</label>
        <input type="text" id="contactName" name="name"
               required minlength="2">

        <label for="contactEmail">Email Address:</label>
        <input type="email" id="contactEmail" name="email"
               required>

        <label for="contactSubject">Subject:</label>
        <input type="text" id="contactSubject" name="subject"
               required minlength="3">

        <label for="contactMessage">Your Message:</label>
        <textarea id="contactMessage" name="message"
                  rows="5" required minlength="10"></textarea>

        <button type="submit">Send Message</button>

        <p id="contactResponse" role="status"></p>
    </form>
</section>

<!-- Interactive Map -->
<section class="map-section">
    <h2>Find Us</h2>
    <p>Explore the map to view our example location.</p>

    <div id="map"></div>
</section>


   

</main>

<footer>
    <p>&copy; 2026 SaveMore Supermarket. All Rights Reserved.</p>
</footer>
